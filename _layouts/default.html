<!doctype html>
<html lang="{{ site.locale | default: 'en' }}">
<head>
  {% include head.html %}
</head>
<body class="{% if page.layout == 'home' %}is-home{% endif %}">
  <a class="skip" href="#main">Skip to content</a>
  {% include header.html %}
  <main id="main">
    {{ content }}
  </main>
  {% include footer.html %}
  <script src="{{ '/assets/js/site.js' | relative_url }}" defer></script>
  {% if page.animation %}<script src="{{ '/assets/js/' | append: page.animation | append: '.js' | relative_url }}" defer></script>{% endif %}
  {% if page.math %}{% include math.html %}{% endif %}
</body>
</html>
