{% assign a = site.author %}
<footer class="site-footer">
  <div class="wrap foot">
    <p>&copy; {{ site.time | date: '%Y' }} {{ a.name }} · {% include email.html %}</p>
    <p class="foot-links">
      <a href="{{ a.arxiv }}">arXiv</a>
      <a href="{{ a.inspire }}">INSPIRE</a>
      <a href="{{ a.orcid }}">ORCID</a>
      <a href="{{ '/privacy/' | relative_url }}">Privacy</a>
    </p>
  </div>
</footer>
