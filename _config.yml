# Site settings for davidprinz.org
# Jekyll does not reload this file during `jekyll serve`; restart the server after editing it.

locale      : "en"
title       : "David Prinz"
description : "David Prinz, mathematical physicist working on quantum field theory, quantum gravity and the mathematical foundations of AI safety. Iliad Fellow at LISA, London."
url         : "https://davidprinz.org"
baseurl     : ""
repository  : "david-prinz/david-prinz.github.io"
timezone    : Europe/London
theme       : null   # no GitHub Pages default theme; this site has its own layouts

# Shown on the home page and in the footer
author:
  name     : "David Prinz"
  title    : "Dr."                     # shown before the name on the home page
  avatar   : "David_Prinz.jpg"          # file in /images/
  tagline  : "Mathematical physicist working on quantum field theory, quantum gravity and the mathematical foundations of AI. Iliad Fellow at LISA, London."
  email_user   : "relay"              # public address, stored in two parts against spam bots
  email_domain : "davidprinz.org"
  arxiv    : "https://arxiv.org/a/prinz_d_1.html"
  inspire  : "https://inspirehep.net/authors/1487358"
  orcid    : "https://orcid.org/0000-0001-7089-8870"

# Used by jekyll-seo-tag for link previews
social:
  name: "David Prinz"
  links:
    - "https://orcid.org/0000-0001-7089-8870"
    - "https://inspirehep.net/authors/1487358"
    - "https://arxiv.org/a/prinz_d_1.html"

# Content
include:
  - _pages
  - files
exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - LICENSE
  - vendor
  - .bundle
  - .sass-cache
  - .jekyll-cache
  - node_modules

defaults:
  - scope:
      path: ""
      type: pages
    values:
      layout: page

# Conversion
markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  smart_quotes: lsquo,rsquo,ldquo,rdquo

# Plugins (all supported by GitHub Pages)
plugins:
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-redirect-from
